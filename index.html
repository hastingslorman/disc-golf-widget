<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Disc Golf Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Cody Killingsworth's Bag</h1>

    <div class="disc-card">

        <img id="disc-image" src="images/disc_1.png" alt="Disc golf disc">

        <h2 id="disc-name">MVP Reactor</h2>

        <div id="disc-info">
            <p><strong>Flight numbers:</strong> 5/5/-0.5/1.5</p>
            <p><strong>Weight:</strong> 176g</p>
            <p><strong>Type:</strong> Midrange</p>
            <p><strong>Description:</strong> Straight with reliable fade</p>
            <p><strong>Status:</strong> Bagged</p>
        </div>

        <p id="disc-counter">Disc 1 of 27</p>

        <div class="buttons">
            <button type="button" id="previous-button">← Previous</button>
            <button type="button" id="next-button">Next →</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
