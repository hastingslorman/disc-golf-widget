<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Disc Golf Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Disc Golf Collection</h1>

    <div class="disc-card">
    <img id="disc-image" src="images/disc_1.png" alt="Disc golf disc">

    <h2 id="disc-name">My Disc</h2>
    <p id="disc-info">Disc golf disc</p>
    <p id="disc-counter">Disc 1 of 27</p>

    <div class="buttons">
        <button type="button" id="previous-button">← Previous</button>
        <button type="button" id="next-button">Next →</button>
    </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
